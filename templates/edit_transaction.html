{% extends "base.html" %}

{% block title %}Edit Transaction - Spendly{% endblock %}

{% block content %}
<div class="max-w-3xl animate-fade-in">

    <!-- Header -->
    <div class="mb-6">
        <a href="{{ url_for('transactions.list_transactions') }}"
           class="text-xs font-semibold text-indigo-600 dark:text-lime-400 hover:text-indigo-700 dark:hover:text-lime-300 transition flex items-center gap-1.5 mb-3">
            <span>←</span> Back to Transactions
        </a>

        <h1 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white">
            Edit Transaction
        </h1>
        <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">
            Update your transaction details.
        </p>
    </div>

    <!-- Form -->
    <div class="bg-white dark:bg-[#16181d] rounded-2xl border border-gray-100 dark:border-gray-800 shadow-sm p-6 md:p-8 card-hover">
        <form method="POST" class="space-y-6">

            <!-- Type -->
            <div>
                <label for="type" class="block text-xs uppercase font-semibold text-gray-700 dark:text-gray-300 tracking-wider mb-2">
                    Transaction Type
                </label>
                <select name="type" id="type" required
                        class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-800/80 text-gray-900 dark:text-white text-sm focus:ring-2 focus:ring-gray-900 dark:focus:ring-lime-400 outline-none transition">
                    <option value="Income" {% if transaction.type == "Income" %}selected{% endif %}>Income</option>
                    <option value="Expense" {% if transaction.type == "Expense" %}selected{% endif %}>Expense</option>
                </select>
            </div>

            <!-- Category -->
            <div>
                <label for="category" class="block text-xs uppercase font-semibold text-gray-700 dark:text-gray-300 tracking-wider mb-2">
                    Category
                </label>
                <select name="category_id" id="category" required
                        class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/80 text-gray-900 dark:text-white text-sm focus:ring-2 focus:ring-gray-900 dark:focus:ring-lime-400 outline-none transition">
                    {% for category in categories %}
                        <option value="{{ category.id }}" data-type="{{ category.type }}" {% if category.id == transaction.category_id %}selected{% endif %}>
                            {{ category.name }} ({{ category.type }})
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Amount -->
            <div>
                <label for="amount" class="block text-xs uppercase font-semibold text-gray-700 dark:text-gray-300 tracking-wider mb-2">
                    Amount
                </label>
                <input type="number" id="amount" name="amount" step="0.01" min="0.01" value="{{ transaction.amount }}" required
                       class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-800/80 text-gray-900 dark:text-white text-sm focus:ring-2 focus:ring-gray-900 dark:focus:ring-lime-400 outline-none transition">
            </div>

            <!-- Description -->
            <div>
                <label for="description" class="block text-xs uppercase font-semibold text-gray-700 dark:text-gray-300 tracking-wider mb-2">
                    Description
                </label>
                <input type="text" id="description" name="description" maxlength="255" value="{{ transaction.description or '' }}" placeholder="e.g. Grocery shopping"
                       class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-800/80 text-gray-900 dark:text-white placeholder-gray-400 text-sm focus:ring-2 focus:ring-gray-900 dark:focus:ring-lime-400 outline-none transition">
            </div>

            <!-- Date -->
            <div>
                <label for="transaction_date" class="block text-xs uppercase font-semibold text-gray-700 dark:text-gray-300 tracking-wider mb-2">
                    Transaction Date
                </label>
                <input type="date" id="transaction_date" name="transaction_date" value="{{ transaction.transaction_date }}" required
                       class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-800/80 text-gray-900 dark:text-white text-sm focus:ring-2 focus:ring-gray-900 dark:focus:ring-lime-400 outline-none transition">
            </div>

            <!-- Buttons -->
            <div class="flex gap-3 pt-3 border-t border-gray-100 dark:border-gray-800">
                <button type="submit"
                        class="flex-1 px-6 py-2.5 bg-[#17191c] text-white dark:bg-lime-400 dark:text-gray-950 rounded-xl text-sm font-semibold hover:bg-black dark:hover:bg-lime-300 transition btn-hover shadow-sm">
                    Update Transaction
                </button>

                <a href="{{ url_for('transactions.list_transactions') }}"
                   class="px-6 py-2.5 border border-gray-200 dark:border-gray-700 rounded-xl text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 transition btn-hover text-center">
                    Cancel
                </a>
            </div>

        </form>
    </div>

</div>
{% endblock %}

{% block extra_scripts %}


<!-- Category filtering -->

<script>

    const typeSelect =
        document.getElementById("type");

    const categorySelect =
        document.getElementById("category");


    function filterCategories() {

        const selectedType =
            typeSelect.value;

        const options =
            categorySelect.querySelectorAll("option");


        options.forEach(option => {

            const categoryType =
                option.dataset.type;

            if (categoryType === selectedType) {

                option.hidden = false;

            } else {

                option.hidden = true;

            }

        });


        // Select first visible category
        const visibleOption =
            [...options].find(
                option => !option.hidden
            );

        if (visibleOption) {

            const currentSelected =
                [...options].find(
                    option =>
                        option.selected &&
                        !option.hidden
                );

            if (!currentSelected) {
                visibleOption.selected = true;
            }

        }

    }


    typeSelect.addEventListener(
        "change",
        filterCategories
    );


    filterCategories();

</script>

{% endblock %}

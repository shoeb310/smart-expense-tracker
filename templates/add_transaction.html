<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Transaction - Spendly</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-[#f5f7f8] text-gray-900">


<div class="min-h-screen flex">


    <!-- SIDEBAR -->

    <aside
        class="w-60 bg-white border-r border-gray-100
               min-h-screen flex flex-col
               px-4 py-7">

        <div class="flex items-center gap-3 px-3 mb-10">

            <div
                class="w-7 h-7 bg-lime-300
                       rounded-lg">
            </div>

            <span class="text-xl font-bold">
                Spendly
            </span>

        </div>


        <nav class="space-y-2">

            <a
                href="{{ url_for('dashboard') }}"
                class="flex items-center gap-3
                       px-3 py-3 rounded-xl
                       text-gray-500
                       hover:bg-gray-50">

                <span>⌂</span>

                Dashboard

            </a>


            <a
                href="{{ url_for('transactions.add_transaction') }}"
                class="flex items-center gap-3
                       px-3 py-3 rounded-xl
                       bg-gray-900 text-white
                       text-sm font-medium">

                <span>＋</span>

                Add Transaction

            </a>


            <a
                href="{{ url_for('transactions.list_transactions') }}"
                class="flex items-center gap-3
                       px-3 py-3 rounded-xl
                       text-gray-500">

                <span>↕</span>

                Transactions

            </a>


            <a
                href="{{ url_for('reports.reports') }}"
                class="flex items-center gap-3
                       px-3 py-3 rounded-xl
                       text-gray-500">

                <span>▥</span>

                Reports

            </a>

        </nav>


        <div class="mt-auto">

            <a
                href="{{ url_for('auth.logout') }}"
                class="flex items-center gap-3
                       px-3 py-3 rounded-xl
                       text-gray-500
                       hover:bg-red-50
                       hover:text-red-600">

                <span>↪</span>

                Logout

            </a>

        </div>

    </aside>



    <!-- MAIN -->

    <main class="flex-1 p-8">


        <!-- HEADER -->

        <div class="mb-8">

            <h1 class="text-3xl font-bold">

                Add Transaction

            </h1>

            <p class="text-gray-500 mt-2">

                Record your income or expenses.

            </p>

        </div>



        <!-- FLASH MESSAGES -->

        {% with messages =
            get_flashed_messages(with_categories=true)
        %}

            {% for category, message in messages %}

                <div
                    class="mb-5 p-4 rounded-xl
                    {% if category == 'success' %}
                        bg-green-100 text-green-700
                    {% else %}
                        bg-red-100 text-red-700
                    {% endif %}">

                    {{ message }}

                </div>

            {% endfor %}

        {% endwith %}



        <!-- FORM CARD -->

        <div
            class="max-w-3xl
                   bg-white
                   rounded-2xl
                   border border-gray-100
                   p-8">


            <form
                method="POST"
                class="space-y-6">


                <!-- TYPE -->

                <div>

                    <label
                        class="block text-sm font-semibold mb-2">

                        Transaction Type

                    </label>


                    <div class="grid grid-cols-2 gap-4">


                        <label
                            class="cursor-pointer">

                            <input
                                type="radio"
                                name="type"
                                value="Expense"
                                checked
                                class="peer hidden">


                            <div
                                class="border
                                       border-gray-200
                                       rounded-xl
                                       p-4
                                       peer-checked:border-red-400
                                       peer-checked:bg-red-50">

                                <div class="font-semibold">

                                    Expense

                                </div>

                                <div
                                    class="text-xs
                                           text-gray-500 mt-1">

                                    Money you spend

                                </div>

                            </div>

                        </label>


                        <label
                            class="cursor-pointer">

                            <input
                                type="radio"
                                name="type"
                                value="Income"
                                class="peer hidden">


                            <div
                                class="border
                                       border-gray-200
                                       rounded-xl
                                       p-4
                                       peer-checked:border-green-400
                                       peer-checked:bg-green-50">

                                <div class="font-semibold">

                                    Income

                                </div>

                                <div
                                    class="text-xs
                                           text-gray-500 mt-1">

                                    Money you receive

                                </div>

                            </div>

                        </label>

                    </div>

                </div>



                <!-- AMOUNT -->

                <div>

                    <label
                        for="amount"
                        class="block text-sm
                               font-semibold mb-2">

                        Amount

                    </label>


                    <div class="relative">

                        <span
                            class="absolute left-4
                                   top-3.5
                                   text-gray-400">

                            ₹

                        </span>


                        <input
                            type="number"
                            id="amount"
                            name="amount"
                            step="0.01"
                            min="0.01"
                            placeholder="0.00"
                            required
                            class="w-full
                                   pl-9 pr-4 py-3
                                   border border-gray-200
                                   rounded-xl
                                   focus:outline-none
                                   focus:ring-2
                                   focus:ring-lime-300">

                    </div>

                </div>



                <!-- CATEGORY -->

                <div>

                    <label
                        for="category_id"
                        class="block text-sm
                               font-semibold mb-2">

                        Category

                    </label>


                    <select
                        id="category_id"
                        name="category_id"
                        required
                        class="w-full
                               px-4 py-3
                               border border-gray-200
                               rounded-xl
                               bg-white
                               focus:outline-none
                               focus:ring-2
                               focus:ring-lime-300">

                        <option value="">
                            Select a category
                        </option>


                        {% for category in categories %}

                            <option
                                value="{{ category.id }}"
                                data-type="{{ category.type }}">

                                {{ category.name }}

                            </option>

                        {% endfor %}

                    </select>

                </div>



                <!-- DESCRIPTION -->

                <div>

                    <label
                        for="description"
                        class="block text-sm
                               font-semibold mb-2">

                        Description

                    </label>


                    <input
                        type="text"
                        id="description"
                        name="description"
                        maxlength="255"
                        placeholder="e.g. Lunch at restaurant"
                        class="w-full
                               px-4 py-3
                               border border-gray-200
                               rounded-xl
                               focus:outline-none
                               focus:ring-2
                               focus:ring-lime-300">

                </div>



                <!-- DATE -->

                <div>

                    <label
                        for="transaction_date"
                        class="block text-sm
                               font-semibold mb-2">

                        Transaction Date

                    </label>


                    <input
                        type="date"
                        id="transaction_date"
                        name="transaction_date"
                        required
                        class="w-full
                               px-4 py-3
                               border border-gray-200
                               rounded-xl
                               focus:outline-none
                               focus:ring-2
                               focus:ring-lime-300">

                </div>



                <!-- BUTTONS -->

                <div
                    class="flex justify-end gap-3
                           pt-4
                           border-t border-gray-100">


                    <a
                        href="{{ url_for('dashboard') }}"
                        class="px-5 py-3
                               rounded-xl
                               border border-gray-200
                               text-sm
                               font-medium">

                        Cancel

                    </a>


                    <button
                        type="submit"
                        class="px-6 py-3
                               rounded-xl
                               bg-gray-900
                               text-white
                               text-sm
                               font-semibold
                               hover:bg-gray-800">

                        Add Transaction

                    </button>

                </div>

            </form>

        </div>

    </main>

</div>


<!-- CATEGORY FILTER -->

<script>

    const typeInputs =
        document.querySelectorAll(
            'input[name="type"]'
        );

    const categorySelect =
        document.getElementById(
            "category_id"
        );


    function updateCategories() {

        const selectedType =
            document.querySelector(
                'input[name="type"]:checked'
            ).value;


        const options =
            categorySelect.querySelectorAll(
                "option"
            );


        categorySelect.value = "";


        options.forEach(option => {

            if (!option.dataset.type) {
                return;
            }


            if (option.dataset.type === selectedType) {

                option.hidden = false;

            } else {

                option.hidden = true;

            }

        });

    }


    typeInputs.forEach(input => {

        input.addEventListener(
            "change",
            updateCategories
        );

    });


    updateCategories();

</script>


</body>

</html>
